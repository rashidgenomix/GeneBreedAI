name: genebreed_ai
description: "GeneBreed AI — an immersive virtual laboratory for Plant Breeding & Genetics education"
publish_to: 'none'

# Android versionName/versionCode and iOS CFBundleShortVersionString/CFBundleVersion.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — ChangeNotifier-based providers mirror the Zustand stores in the
  # React web app (gameStore, notebookStore) with the least ceremony.
  provider: ^6.1.2

  # Navigation shell (bottom nav / drawer + per-module routes).
  go_router: ^17.3.0

  # Local persistence for game progress (XP/badges/programs) and notebook entries,
  # equivalent to the web app's localStorage-backed Zustand persist middleware.
  shared_preferences: ^2.3.3

  # Charts for the Virtual Research Lab (heritability histogram, ANOVA bar chart).
  fl_chart: ^1.2.0

  # Field Notebook camera/gallery image capture.
  image_picker: ^1.1.2
  path_provider: ^2.1.5

  # google_fonts for the Inter typeface used on the web app.
  google_fonts: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates all Android/iOS launcher icon sizes from a single source image.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0b1512"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
